name: Local agent checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SamuelSchmidgall/AgentClinic
          ref: b6fbe22300e99a267a7ac94eaa465ab552eef741
          path: vendor/AgentClinic
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-langgraph.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_motion.mjs
